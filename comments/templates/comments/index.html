<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Comentarios</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Estilos LOCALES para index.html */
        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            --card-bg: rgba(30, 41, 59, 0.75);
            --card-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
            --primary-hover: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            --secondary-bg: rgba(255, 255, 255, 0.08);
            --secondary-hover: rgba(255, 255, 255, 0.15);
            --danger-bg: rgba(244, 63, 94, 0.15);
            --danger-hover: rgba(244, 63, 94, 0.3);
            --danger-text: #fb7185;
            --shadow-lg: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            --radius-lg: 20px;
            --radius-md: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            padding: 3rem 1.5rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            gap: 2rem;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--card-border);
        }

        .header h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(90deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
        }

        .comment-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.25s ease;
        }

        .comment-card:hover {
            transform: translateY(-3px);
            border-color: rgba(139, 92, 246, 0.4);
        }

        .comment-body {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .comment-text {
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-main);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .comment-meta {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .comment-actions {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.75rem;
            padding-top: 0.75rem;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
        }

        .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Botones */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.65rem 1.25rem;
            font-size: 0.9rem;
            font-weight: 600;
            border-radius: var(--radius-md);
            text-decoration: none;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            border: none;
            outline: none;
        }

        .btn-primary {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: 0 4px 14px 0 rgba(99, 102, 241, 0.39);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px 0 rgba(99, 102, 241, 0.55);
        }

        .btn-secondary {
            background: var(--secondary-bg);
            color: var(--text-muted);
            border: 1px solid var(--card-border);
        }

        .btn-secondary:hover {
            background: var(--secondary-hover);
            color: var(--text-main);
            transform: translateY(-2px);
        }

        .btn-danger {
            background: var(--danger-bg);
            color: var(--danger-text);
            border: 1px solid rgba(244, 63, 94, 0.3);
        }

        .btn-danger:hover {
            background: var(--danger-hover);
            color: #ffffff;
            transform: translateY(-2px);
        }

        /* Paginación */
        .pagination-nav {
            display: flex;
            justify-content: center;
            margin-top: 1rem;
        }

        .pagination {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 0.5rem;
            padding: 0.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: var(--radius-lg);
            backdrop-filter: blur(12px);
        }

        .page-item {
            display: inline-block;
        }

        .page-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 40px;
            height: 40px;
            padding: 0 0.75rem;
            border-radius: var(--radius-md);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
            text-decoration: none;
            transition: all 0.2s ease;
        }

        .page-link:hover {
            background: var(--secondary-hover);
            color: var(--text-main);
        }

        .page-item.active .page-link {
            background: var(--primary-gradient);
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
        }

        @media (max-width: 640px) {
            body {
                padding: 1.5rem 1rem;
            }

            .header {
                flex-direction: column;
                align-items: flex-start;
                gap: 1rem;
            }

            .header .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>💬 Listado de Comentarios</h1>
            <a href="{% url 'comments:add' %}" class="btn btn-primary">+ Agregar Comentario</a>
        </header>

        <main class="comments-list">
            {% for c in comments %}
                <article class="comment-card">
                    <div class="comment-body">
                        <p class="comment-text">{{ c.text }}</p>
                        <div class="comment-meta">
                            <span>🕒</span>
                            <time>{{ c.date_posted|date:"d M Y, H:i" }}</time>
                        </div>
                    </div>
                    <div class="comment-actions">
                        <a href="{% url 'comments:update' c.id %}" class="btn btn-secondary">Editar</a>
                        <form action="{% url 'comments:delete' c.id %}" method="post" style="display:inline;">
                            {% csrf_token %}
                            <button type="submit" class="btn btn-danger" onclick="return confirm('¿Estás seguro de que deseas eliminar este comentario?');">Eliminar</button>
                        </form>
                    </div>
                </article>
            {% empty %}
                <div class="empty-state">
                    <p>No hay comentarios publicados aún. ¡Sé el primero en agregar uno!</p>
                </div>
            {% endfor %}
        </main>

        {% include 'comments/pagination.html' %}
    </div>
</body>
</html>
